name: CI Checks
permissions: {}

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "examples/**"
      - "src/**"
      - "Cargo.*"
      - "rustfmt.toml"

  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "examples/**"
      - "src/**"
      - "Cargo.*"
      - "rustfmt.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_and_test:
    name: Check and Test ${{ matrix.os }} - ${{ matrix.channel }} - ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # Make warnings errors, this is to prevent warnings slipping through.
    # This is done globally to prevent rebuilds when the RUSTFLAGS env variable changes.
    env:
      RUSTFLAGS: "-Dwarnings"
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-24.04"
          - "windows-latest"
        channel:
          - "1.87.0"
          - "stable"
          - "nightly"
        features:
          - "cron"
          - "croner"
        include:
          - os: "ubuntu-24.04"
            channel: "stable"
            features: "croner,timezones,tokio"
          - os: "windows-latest"
            channel: "stable"
            features: "croner,timezones,tokio"

    steps:
      # Checkout the repo
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # End Checkout the repo


      # Install the clippy and rustfmt components also
      - name: "Install toolchain ${{matrix.channel}} as default"
        env:
          CHANNEL: ${{ matrix.channel }}
          RUST_TOOLCHAIN: ${{matrix.channel}}
        run: |
          # Install the correct toolchain version
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --no-self-update

          # Also install rustfmt and clippy
          rustup component add --toolchain "${RUST_TOOLCHAIN}" rustfmt clippy

          # Set as the default toolchain
          rustup default "${RUST_TOOLCHAIN}"
      # End install components

      # Show environment
      - name: "Show environment"
        run: |
          rustc -vV
          cargo -vV
      # End Show environment


      # Enable Rust Caching
      - name: Rust Caching
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # End Enable Rust Caching


      # Run cargo tests
      - name: "Test features: ${{ matrix.features }}"
        id: test
        if: ${{ !cancelled() }}
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo test --all-targets --no-default-features --features "${FEATURES}"
      # End Run cargo tests


      # Run cargo clippy, and fail on warnings
      - name: "Test features: ${{ matrix.features }}"
        id: clippy
        if: ${{ !cancelled() }}
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo clippy --all-targets --no-default-features --features "${FEATURES}"
      # End Run cargo clippy


      # Run cargo fmt (Only run on stable version)
      - name: "Check formatting"
        id: formatting
        if: ${{ !cancelled() && matrix.channel == 'stable' }}
        run: |
          cargo fmt --all -- --check
      # End Run cargo fmt


      # Check for any previous failures, if there are stop, else continue.
      # This is useful so all test/clippy/fmt actions are done, and they can all be addressed
      - name: "Some checks failed - ${{ matrix.channel }} - ${{ matrix.features }}"
        if: ${{ failure() }}
        env:
          TEST: ${{ steps.test.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          FMT: ${{ steps.formatting.outcome }}
        run: |
          echo "### :x: Checks Failed!" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "|Job|Status|" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|------|" >> "${GITHUB_STEP_SUMMARY}"
          echo "|test|${TEST}|" >> "${GITHUB_STEP_SUMMARY}"
          echo "|clippy|${CLIPPY}|" >> "${GITHUB_STEP_SUMMARY}"
          echo "|fmt|${FMT}|" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Please check the failed jobs and fix where needed." >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          exit 1

      # Check for any previous failures, if there are stop, else continue.
      # This is useful so all test/clippy/fmt actions are done, and they can all be addressed
      - name: "All checks passed - ${{ matrix.channel }} - ${{ matrix.features }}"
        if: ${{ success() }}
        run: |
          echo "### :tada: Checks Passed!" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"

## ############
## Run examples
  run_examples:
    name: Run examples ${{ matrix.channel }} - ${{ matrix.features }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Make warnings errors, this is to prevent warnings slipping through.
    # This is done globally to prevent rebuilds when the RUSTFLAGS env variable changes.
    env:
      RUSTFLAGS: "-Dwarnings"
    strategy:
      fail-fast: false
      matrix:
        channel:
          - "stable"
        features:
          - "cron"
          - "croner"
          - "croner,timezones,tokio"

    steps:
      # Checkout the repo
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # End Checkout the repo


      # Install the clippy and rustfmt components also
      - name: "Install toolchain ${{matrix.channel}} as default"
        env:
          CHANNEL: ${{ matrix.channel }}
          RUST_TOOLCHAIN: ${{matrix.channel}}
        run: |
          # Install the correct toolchain version
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --no-self-update

          # Set as the default toolchain
          rustup default "${RUST_TOOLCHAIN}"
      # End install components


      # Show environment
      - name: "Show environment"
        run: |
          rustc -vV
          cargo -vV
      # End Show environment


      # Enable Rust Caching
      - name: Rust Caching
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # End Enable Rust Caching


      # Run example `simple_job_mpsc`
      - name: "Run simple_job_mpsc: ${{ matrix.features }}"
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo run --no-default-features --features "${FEATURES}" --example simple_job_mpsc
      # End Run example


      # Run example `simple_job_thread`
      - name: "Run simple_job_thread: ${{ matrix.features }}"
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo run --no-default-features --features "${FEATURES}" --example simple_job_thread
      # End Run example


      # Run example `simple_job_tokio`
      - name: "Run simple_job_tokio: ${{ matrix.features }}"
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo run --no-default-features --features "${FEATURES}" --example simple_job_tokio
      # End Run example


      # Run example `simple_job_tz`
      - name: "Run simple_job_tz: ${{ matrix.features }}"
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo run --no-default-features --features "${FEATURES}" --example simple_job_tz
      # End Run example


      # Run example `simple_job`
      - name: "Run simple_job: ${{ matrix.features }}"
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo run --no-default-features --features "${FEATURES}" --example simple_job
      # End Run example

        # Run example `simple_job_no_future`
      - name: "Run simple_job: ${{ matrix.features }}"
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo run --no-default-features --features "${FEATURES}" --example simple_job_no_future
      # End Run example


      # Run the extended thread example when Croner is selected
      - name: "Run extended_thread: ${{ matrix.features }}"
        if: ${{ contains(matrix.features, 'croner') }}
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo run --no-default-features --features "${FEATURES}" --example extended_thread


      # Run the native async example when the Tokio feature is selected
      - name: "Run extended_tokio: ${{ matrix.features }}"
        if: ${{ contains(matrix.features, 'tokio') }}
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo run --no-default-features --features "${FEATURES}" --example extended_tokio
